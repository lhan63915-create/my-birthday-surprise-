<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 330px;
      width: 85%;
    }
    h1 { color: #ff3366; margin-bottom: 10px; font-size: 24px; }
    p { color: #555; font-size: 15px; line-height: 1.6; }
    
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }
    .photo-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    button {
      background-color: #ff3366;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    #surprise-message {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎂 Happy Birthday! 🎉</h1>
    
    <div class="photo-grid">
      <img src="IMG_0547.jpeg" alt="Memory 1">
      <img src="IMG_0548.jpeg" alt="Memory 2">
      <img src="IMG_0549.jpeg" alt="Memory 3">
      <img src="IMG_0550.jpeg" alt="Memory 4">
    </div>

    <p>for my lovely girlfriend ❤️❤️❤️❤️</p>
    <button onclick="showSurprise()">နှိပ်ကြည့်ပါ ✨</button>

    <div id="surprise-message">
      <p style="font-weight: bold; color: #ff3366;">
        💖 ပျော်ရွှင်စရာ မွေးနေ့ဖြစ်ပါစေနော်! <br>
        လိုရာဆန္ဒတွေ အကုန်ပြည့်ဝပြီး အမြဲတမ်း ပျော်ရွှင်ပါစေ! 🎁🎈
      </p>
    </div>
  </div>

  <script>
    function showSurprise() {
      document.getElementById('surprise-message').style.display = 'block';
    }
  </script>
</body>
</html>
